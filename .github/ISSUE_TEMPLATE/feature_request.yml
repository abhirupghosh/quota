name: Feature request
description: Suggest an idea for quota.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem, not the solution. "I keep running out of X on Y and can't tell until…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
