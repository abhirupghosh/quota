<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="t">
  <title id="t">How quota works: the Mac reads local logins, asks each SSH host for its logins with a small python3 script, and fetches usage once per account over HTTPS</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a91a5"/>
    </marker>
  </defs>
  <rect width="900" height="380" rx="14" fill="#1b1e28"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Mac -->
    <rect x="330" y="120" width="240" height="140" rx="14" fill="#262a37" stroke="#34C759" stroke-width="2"/>
    <text x="450" y="152" text-anchor="middle" font-size="18" font-weight="700" fill="#f5f6fa">Your Mac</text>
    <text x="450" y="180" text-anchor="middle" font-size="14" fill="#aab1c5" font-family="SF Mono, Menlo, Consolas, monospace">quota status</text>
    <text x="450" y="202" text-anchor="middle" font-size="13" fill="#7c8296">+ SwiftBar plugin</text>
    <text x="450" y="236" text-anchor="middle" font-size="12" fill="#7c8296" font-family="SF Mono, Menlo, Consolas, monospace">~/.config/quota/</text>

    <!-- local files -->
    <rect x="30" y="40" width="230" height="120" rx="12" fill="#232633" stroke="#3a4054"/>
    <text x="48" y="68" font-size="14" font-weight="700" fill="#f5f6fa">Local logins</text>
    <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5">
      <text x="48" y="94" fill="#f0a283">~/.claude.json</text>
      <text x="48" y="116" fill="#5fd3b0">~/.codex/auth.json</text>
      <text x="48" y="138" fill="#b4bfff">~/.grok/auth.json</text>
    </g>
    <path d="M 260 120 C 295 130, 300 150, 328 165" fill="none" stroke="#8a91a5" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- SSH hosts -->
    <rect x="30" y="220" width="230" height="130" rx="12" fill="#232633" stroke="#3a4054"/>
    <text x="48" y="248" font-size="14" font-weight="700" fill="#f5f6fa">SSH hosts</text>
    <text x="48" y="270" font-size="12.5" fill="#aab1c5">ssh &lt;alias&gt; python3 -</text>
    <text x="48" y="292" font-size="12.5" fill="#aab1c5">nothing to install remotely</text>
    <text x="48" y="320" font-size="12.5" fill="#34C759">returns emails + plans only</text>
    <path d="M 328 215 C 300 230, 295 260, 262 280" fill="none" stroke="#8a91a5" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>

    <!-- Usage APIs -->
    <rect x="640" y="40" width="230" height="160" rx="12" fill="#232633" stroke="#3a4054"/>
    <text x="658" y="68" font-size="14" font-weight="700" fill="#f5f6fa">Usage, once per account</text>
    <text x="658" y="96" font-size="12.5" fill="#f0a283">Claude · 5h + weekly</text>
    <text x="658" y="120" font-size="12.5" fill="#5fd3b0">Codex · 5h + weekly</text>
    <text x="658" y="144" font-size="12.5" fill="#b4bfff">Grok · credits</text>
    <text x="658" y="178" font-size="11" fill="#7c8296">HTTPS · cached · no tokens printed</text>
    <path d="M 572 165 C 600 150, 610 130, 638 120" fill="none" stroke="#8a91a5" stroke-width="1.6" marker-end="url(#a)"/>

    <!-- switch -->
    <rect x="640" y="230" width="230" height="120" rx="12" fill="#232633" stroke="#3a4054"/>
    <text x="658" y="258" font-size="14" font-weight="700" fill="#f5f6fa">Claude switch</text>
    <text x="658" y="282" font-size="12.5" fill="#aab1c5" font-family="SF Mono, Menlo, Consolas, monospace">save · push · use</text>
    <text x="658" y="306" font-size="12.5" fill="#aab1c5">snapshots copied over SSH</text>
    <text x="658" y="330" font-size="12.5" fill="#E0A106">next session only</text>
    <path d="M 572 220 C 600 235, 610 260, 638 280" fill="none" stroke="#8a91a5" stroke-width="1.6" marker-end="url(#a)"/>
  </g>
</svg>
