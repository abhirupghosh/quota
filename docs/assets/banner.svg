<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">quota</title>
  <desc id="d">quota — see which Claude, Codex and Grok subscription is live on every machine, and switch Claude accounts from the menu bar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14161f"/>
      <stop offset="1" stop-color="#232838"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34C759"/>
      <stop offset="0.55" stop-color="#E0A106"/>
      <stop offset="1" stop-color="#E85D5D"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#dots)"/>

  <!-- gauge -->
  <g transform="translate(205 205)">
    <path d="M -120 0 A 120 120 0 0 1 120 0" fill="none" stroke="#2f3547" stroke-width="26" stroke-linecap="round"/>
    <path d="M -120 0 A 120 120 0 0 1 120 0" fill="none" stroke="url(#arc)" stroke-width="26" stroke-linecap="round"/>
    <g stroke="#14161f" stroke-width="3">
      <line x1="-133" y1="0" x2="-107" y2="0" transform="rotate(45)"/>
      <line x1="-133" y1="0" x2="-107" y2="0" transform="rotate(90)"/>
      <line x1="-133" y1="0" x2="-107" y2="0" transform="rotate(135)"/>
    </g>
    <g transform="rotate(-28)">
      <line x1="0" y1="0" x2="0" y2="-92" stroke="#f5f6fa" stroke-width="8" stroke-linecap="round"/>
    </g>
    <circle r="16" fill="#f5f6fa"/>
    <circle r="6" fill="#14161f"/>
    <text x="0" y="62" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace" font-size="30" font-weight="700" fill="#34C759">C17 X4 G61</text>
  </g>

  <!-- wordmark -->
  <text x="400" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="104" font-weight="800" fill="#f5f6fa" letter-spacing="-3">quota</text>
  <text x="404" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#aab1c5">Which AI subscription is live — on every machine.</text>

  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="20" font-weight="600">
    <rect x="404" y="244" width="118" height="40" rx="20" fill="#d97757" opacity="0.18"/>
    <text x="463" y="270" text-anchor="middle" fill="#f0a283">Claude</text>
    <rect x="534" y="244" width="110" height="40" rx="20" fill="#10a37f" opacity="0.2"/>
    <text x="589" y="270" text-anchor="middle" fill="#5fd3b0">Codex</text>
    <rect x="656" y="244" width="96" height="40" rx="20" fill="#8b9cff" opacity="0.2"/>
    <text x="704" y="270" text-anchor="middle" fill="#b4bfff">Grok</text>
    <text x="772" y="270" fill="#6b7389">· menu bar · CLI · SSH hosts</text>
  </g>
</svg>
