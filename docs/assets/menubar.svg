<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="t">
  <title id="t">quota in the macOS menu bar: a gauge with the worst usage percent, and a dropdown with one row per host and a Switch Claude submenu</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3f8f"/>
      <stop offset="0.5" stop-color="#7b4d9e"/>
      <stop offset="1" stop-color="#d0707a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="900" height="400" rx="14" fill="url(#wall)"/>

  <!-- menu bar -->
  <rect width="900" height="30" fill="#1d1e24" opacity="0.82"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#f2f2f5">
    <circle cx="24" cy="15" r="6" fill="#f2f2f5"/>
    <text x="44" y="20" font-weight="700">Terminal</text>
    <text x="122" y="20">Shell</text>
    <text x="170" y="20">Edit</text>
    <text x="212" y="20">View</text>
    <text x="760" y="20">Tue 3 Nov  9:41</text>
  </g>
  <!-- quota item (highlighted) -->
  <rect x="566" y="3" width="66" height="24" rx="5" fill="#ffffff" opacity="0.22"/>
  <g transform="translate(584 20)" fill="none" stroke-linecap="round">
    <path d="M -9 0 A 9 9 0 0 1 9 0" stroke="#34C759" stroke-width="2.4"/>
    <line x1="0" y1="0" x2="3" y2="-6" stroke="#34C759" stroke-width="2"/>
  </g>
  <text x="598" y="20" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#34C759">61</text>
  <g fill="#f2f2f5" opacity="0.9">
    <rect x="648" y="10" width="20" height="10" rx="3" fill="none" stroke="#f2f2f5" stroke-width="1.4"/>
    <rect x="650" y="12" width="13" height="6" rx="1.5"/>
    <path d="M 690 20 l 8 -10 l 8 10 z" opacity="0.8"/>
    <circle cx="730" cy="15" r="6" fill="none" stroke="#f2f2f5" stroke-width="1.6"/>
  </g>

  <!-- dropdown -->
  <g filter="url(#shadow)">
    <rect x="300" y="36" width="344" height="196" rx="10" fill="#2a2b31" opacity="0.97"/>
  </g>
  <rect x="300.5" y="36.5" width="343" height="195" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-family="SF Mono, Menlo, Consolas, monospace" font-size="13">
    <text x="320" y="74" fill="#34C759">mac</text>
    <text x="392" y="74" fill="#34C759">C17/42</text>
    <text x="472" y="74" fill="#34C759">X4/31</text>
    <text x="534" y="74" fill="#34C759">G61</text>
    <text x="626" y="74" fill="#9a9ca6" text-anchor="end">›</text>
    <rect x="306" y="84" width="332" height="26" rx="5" fill="#2f6fde"/>
    <text x="320" y="102" fill="#ffffff">devbox</text>
    <text x="392" y="102" fill="#ffffff">C17/42</text>
    <text x="472" y="102" fill="#ffffff">X88/53</text>
    <text x="534" y="102" fill="#ffffff">G—</text>
    <text x="562" y="102" fill="#ffffff">gmail</text>
    <text x="626" y="102" fill="#ffffff" text-anchor="end">›</text>
    <text x="320" y="132" fill="#E85D5D">gpu</text>
    <text x="392" y="132" fill="#E85D5D">ssh: timed out</text>
    <line x1="312" y1="150" x2="632" y2="150" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="320" y="176" fill="#e8e9ee" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">↻  Refresh</text>
    <text x="320" y="218" fill="#7c7f8a" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">C = Claude · X = Codex · G = Grok · 5h / weekly %</text>
  </g>

  <!-- submenu -->
  <g filter="url(#shadow)">
    <rect x="648" y="80" width="236" height="118" rx="10" fill="#2a2b31" opacity="0.97"/>
  </g>
  <rect x="648.5" y="80.5" width="235" height="117" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  <g font-size="13">
    <text x="664" y="104" fill="#8d909b" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Switch Claude  (next session)</text>
    <text x="664" y="134" fill="#8d909b" font-family="SF Mono, Menlo, Consolas, monospace">✓ work  (live)</text>
    <rect x="654" y="146" width="224" height="26" rx="5" fill="#2f6fde"/>
    <text x="680" y="164" fill="#ffffff" font-family="SF Mono, Menlo, Consolas, monospace">personal · gmail</text>
    <text x="664" y="190" fill="#6f727d" font-size="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">running sessions keep their account</text>
  </g>

  <!-- callouts -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff">
    <path d="M 292 314 C 110 310, 110 12, 560 16" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="4 4"/>
    <text x="300" y="320" font-weight="700">Worst usage on this Mac, at a glance</text>
    <text x="300" y="342" fill="#f0e6ff" opacity="0.9">Green, amber or red. Refreshes every 3 minutes.</text>
    <text x="690" y="250" font-weight="700">One click</text>
    <text x="690" y="272" fill="#f0e6ff" opacity="0.9">swaps the Claude login</text>
    <text x="690" y="294" fill="#f0e6ff" opacity="0.9">on that host.</text>
  </g>
</svg>
